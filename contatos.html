<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dEStino - Contatos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
    <div class="header-main-container">
        <!-- Logo -->
        <a href="index.html" class="logo-center">
            dES<span>tino</span>
        </a>
        
        <!-- Barra de Pesquisa -->
        <div class="header-search-bar">
            <input type="text" placeholder="O que você está procurando?">
            <button type="submit">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Menu de Tópicos Logo Abaixo -->
    <nav class="side-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="mulheres.html">Mulheres que inspiram</a></li>
            <li><a href="destinos_exp.html">Destinos e Experiências</a></li>
            <li><a href="recomendacoes.html">Recomendações</a></li>
            <li><a href="futuros_eventos.html">Futuros Eventos</a></li>
            <li><a href="contatos.html" class="active" aria-current="page">Contatos</a></li>
        </ul>
    </nav>
</header>

    <main>
        <h1 class="page-title">Fale Conosco</h1>
        <p class="page-subtitle">Tem alguma dica de roteiro, sugestão de ponto turístico ou parceria? Entre em contato conosco!</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Seu Nome:</label>
                <input type="text" id="name" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">Seu E-mail:</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="message">Mensagem / Dica:</label>
                <textarea id="message" required placeholder="Conte sua experiência ou tire sua dúvida..."></textarea>
            </div>

            <button type="submit" class="btn">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 dEStino. Todos os direitos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
