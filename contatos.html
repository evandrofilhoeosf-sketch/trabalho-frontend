<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurEStando - Contatos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Tur<span>ES</span>tando</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="praias.html">Praias</a></li>
                    <li><a href="serra.html">Região Serrana</a></li>
                    <li><a href="cultura.html">Cultura</a></li>
                    <li><a href="contatos.html">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Fale Conosco</h1>
        <p class="page-subtitle">Tem alguma dica de roteiro, sugestão de ponto turístico ou parceria? Entre em contato conosco!</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Seu Nome:</label>
                <input type="text" id="name" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">Seu E-mail:</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="message">Mensagem / Dica:</label>
                <textarea id="message" required placeholder="Conte sua experiência ou tire sua dúvida..."></textarea>
            </div>

            <button type="submit" class="btn">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 TurEStando. Todos os direitos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
